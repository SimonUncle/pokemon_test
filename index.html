<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>포켓몬스터 Yellow 버전</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }

        #game-container {
            background: #9bbc0f;
            border: 16px solid #444;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8),
                        inset 0 0 0 4px #666;
            position: relative;
        }

        #game-canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
        }

        .power-led {
            position: absolute;
            top: -40px;
            right: 20px;
            width: 12px;
            height: 12px;
            background: #ff0000;
            border-radius: 50%;
            box-shadow: 0 0 10px #ff0000;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div class="power-led"></div>
        <canvas id="game-canvas" width="640" height="576"></canvas>
    </div>

    <script src="game.js"></script>
</body>
</html>
